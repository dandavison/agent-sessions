<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
<style>
  svg{--ink:#1c1c1e;--accent:#0a58ca;--dim:#c3c3ca}
  @media (prefers-color-scheme:dark){svg{--ink:#e8e8ea;--accent:#79a9ff;--dim:#44464d}}
  .ink{stroke:var(--ink);fill:none;stroke-linecap:round;stroke-linejoin:round}
  .inkf{fill:var(--ink)}
  .acc{stroke:var(--accent);fill:none;stroke-linecap:round;stroke-linejoin:round}
  .accf{fill:var(--accent)}
  .dim{stroke:var(--dim);fill:none;stroke-linecap:round;stroke-linejoin:round}
  .dimf{fill:var(--dim)}
</style>
<defs><clipPath id="h"><circle cx="16" cy="16" r="12.7"/></clipPath></defs>
<g clip-path="url(#h)">
  <g stroke-width="3.6" stroke-linecap="butt">
    <path class="dim" d="M0 8.6 H32"/>
    <path class="acc" d="M0 16 H32"/>
    <path class="dim" d="M0 23.4 H32"/>
  </g>
</g>
<circle class="ink" cx="16" cy="16" r="12.7" stroke-width="2.6" fill="none"/>
</svg>
